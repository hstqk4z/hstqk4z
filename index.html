<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>液态相机 · Liquid Cam</title>
<style>
:root{
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  touch-action:none;
}

/* ================= 舞台 ================= */
#stage{position:fixed;inset:0;overflow:hidden;background:#000;}
#video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transform-origin:center center;
  will-change:transform;transition:filter .25s ease;
}
#vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.45) 100%);
  opacity:.55;
}
#grid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;}
#grid.on{opacity:1;}
#grid span{position:absolute;background:rgba(255,255,255,.28);}
#grid .v{top:0;bottom:0;width:1px;}
#grid .v1{left:33.333%;} #grid .v2{left:66.666%;}
#grid .h{left:0;right:0;height:1px;}
#grid .h1{top:33.333%;} #grid .h2{top:66.666%;}

/* ================= 液态玻璃基础 ================= */
.glass{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.10) 45%, rgba(255,255,255,.05) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.30);
  box-shadow:
    0 10px 30px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.60),
    inset 0 -1px 1px rgba(255,255,255,.10);
}
.glass::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg, rgba(255,255,255,0) 32%, rgba(255,255,255,.42) 47%, rgba(255,255,255,0) 62%);
  background-size:260% 260%;
  animation:sheen 7s ease-in-out infinite;
  opacity:.55;mix-blend-mode:screen;
}
@keyframes sheen{
  0%,100%{background-position:125% -20%;}
  50%{background-position:-25% 120%;}
}

/* ================= 顶栏 ================= */
.topbar{
  position:absolute;top:calc(var(--safe-t) + 14px);left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 18px;z-index:20;pointer-events:none;
}
.topbar .group{display:flex;gap:12px;pointer-events:auto;}
.icon-btn{
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  color:#fff;border:1px solid rgba(255,255,255,.30);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s;
}
.icon-btn:active{transform:scale(.88);}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.icon-btn.on{
  background:linear-gradient(145deg, rgba(255,236,150,.85), rgba(255,196,60,.75));
  border-color:rgba(255,255,255,.7);
  box-shadow:0 0 22px rgba(255,205,70,.65), inset 0 1px 0 rgba(255,255,255,.9);
}
.icon-btn.on svg{stroke:#3a2a00;}
.icon-btn.disabled{opacity:.35;pointer-events:none;}

/* ================= 变焦滑轨 ================= */
#zoomRail{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  z-index:20;display:flex;flex-direction:column;align-items:center;gap:12px;
}
#zoomTrack{
  position:relative;width:44px;height:180px;border-radius:22px;
  background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 8px 24px rgba(0,0,0,.4);
  touch-action:none;cursor:pointer;
}
#zoomTrack .tick{
  position:absolute;left:0;right:0;height:1px;
  background:rgba(255,255,255,.18);pointer-events:none;
}
#zoomThumb{
  position:absolute;left:50%;bottom:0;
  width:30px;height:30px;border-radius:50%;
  transform:translate(-50%,50%);
  background:radial-gradient(circle at 32% 28%, #ffffff, #d8d8d8 55%, #b8b8b8 100%);
  box-shadow:0 4px 14px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.7), inset 0 -2px 4px rgba(0,0,0,.15);
  transition:bottom .05s linear;
}
#zoomThumb::after{
  content:'';position:absolute;inset:9px;border-radius:50%;
  background:rgba(0,0,0,.12);
}
#zoomLabel{
  font-size:12px;font-weight:600;letter-spacing:.5px;
  padding:5px 12px;border-radius:999px;
  background:rgba(0,0,0,.42);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.18);
  min-width:52px;text-align:center;
  font-variant-numeric:tabular-nums;
}

/* ================= 底栏 ================= */
#bottomBar{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  padding-bottom:calc(var(--safe-b) + 14px);
  background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.85) 100%);
}
#filterStrip{
  display:flex;gap:10px;overflow-x:auto;padding:14px 18px 6px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
#filterStrip::-webkit-scrollbar{display:none;}
.filter-chip{
  flex:0 0 auto;padding:9px 18px;border-radius:999px;
  font-size:13px;letter-spacing:.6px;color:rgba(255,255,255,.82);
  background:rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  transition:all .25s cubic-bezier(.4,0,.2,1);
  cursor:pointer;white-space:nowrap;
}
.filter-chip.active{
  background:rgba(255,255,255,.94);color:#111;font-weight:700;
  border-color:transparent;
  box-shadow:0 6px 20px rgba(255,255,255,.30), inset 0 1px 0 #fff;
  transform:translateY(-1px);
}

.controls{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 34px 4px;
}
.side-btn{
  width:54px;height:54px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid rgba(255,255,255,.24);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}
.side-btn:active{transform:scale(.88);}
.side-btn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#thumbBtn{background-size:cover;background-position:center;}
#thumbBtn svg{opacity:.85;}

#shutter{
  position:relative;width:80px;height:80px;border-radius:50%;
  border:3px solid rgba(255,255,255,.92);
  background:radial-gradient(circle, rgba(255,255,255,.98) 0%, rgba(255,255,255,.72) 46%, rgba(255,255,255,.25) 100%);
  box-shadow:
    0 0 0 5px rgba(0,0,0,.22),
    0 10px 30px rgba(0,0,0,.55),
    inset 0 3px 8px rgba(255,255,255,.95),
    inset 0 -3px 10px rgba(0,0,0,.12);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s;
  cursor:pointer;
}
#shutter::before{
  content:'';position:absolute;inset:7px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.45);
}
#shutter:active{
  transform:scale(.9);
  box-shadow:0 0 0 5px rgba(0,0,0,.22), 0 4px 14px rgba(0,0,0,.5), inset 0 2px 6px rgba(255,255,255,.9);
}

/* 快门闪光 */
#flashFx{
  position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;
  z-index:60;transition:opacity .45s ease-out;
}
#flashFx.fire{opacity:.92;transition:none;}

/* ================= 启动屏 ================= */
#startScreen{
  position:fixed;inset:0;z-index:100;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 38%, #1c2233 0%, #05060a 70%);
  transition:opacity .5s ease, visibility .5s;
}
#startScreen.hide{opacity:0;visibility:hidden;}
.start-card{
  width:min(84vw,360px);padding:38px 28px 30px;border-radius:34px;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;
}
.logo{
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff, #8fb6ff 40%, #3b64d8 100%);
  box-shadow:0 0 40px rgba(110,160,255,.75), inset 0 2px 8px rgba(255,255,255,.8);
  margin-bottom:4px;
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.start-card h1{font-size:24px;font-weight:700;letter-spacing:2px;}
.start-card p{font-size:12.5px;color:rgba(255,255,255,.6);letter-spacing:1px;line-height:1.6;}
#startBtn{
  margin-top:10px;width:100%;padding:15px;border-radius:999px;
  font-size:16px;font-weight:600;letter-spacing:2px;color:#fff;
  cursor:pointer;border:1px solid rgba(255,255,255,.35);
  transition:transform .18s;
}
#startBtn:active{transform:scale(.96);}
.hint{font-size:11px;color:rgba(255,255,255,.32);letter-spacing:.5px;margin-top:6px;}
#errorMsg{font-size:12.5px;color:#ff8c8c;line-height:1.6;display:none;}

/* ================= 设置面板 ================= */
#settingsOverlay{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;transition:.32s;
}
#settingsOverlay.show{opacity:1;visibility:visible;}

#settingsPanel{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:10px 22px calc(var(--safe-b) + 26px);
  border-radius:34px 34px 0 0;
  border-bottom:none;
  transform:translateY(105%);
  transition:transform .42s cubic-bezier(.32,.72,0,1);
  max-height:82vh;overflow-y:auto;
}
#settingsPanel.show{transform:translateY(0);}
.panel-handle{
  width:42px;height:5px;border-radius:99px;background:rgba(255,255,255,.32);
  margin:4px auto 18px;
}
.panel-title{
  font-size:19px;font-weight:700;letter-spacing:1px;margin-bottom:18px;padding-left:4px;
}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px;border-radius:20px;margin-bottom:10px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
}
.setting-title{font-size:15px;font-weight:500;letter-spacing:.5px;}
.setting-sub{font-size:11.5px;color:rgba(255,255,255,.45);margin-top:3px;letter-spacing:.3px;}

.switch{position:relative;display:inline-block;width:52px;height:31px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;}
.switch span{
  position:absolute;inset:0;border-radius:99px;cursor:pointer;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.16);
  transition:.3s;
}
.switch span::before{
  content:'';position:absolute;width:25px;height:25px;border-radius:50%;
  left:2px;top:2px;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
  transition:.3s cubic-bezier(.34,1.56,.64,1);
}
.switch input:checked + span{background:linear-gradient(135deg,#5eead4,#22d3ee);border-color:rgba(255,255,255,.4);}
.switch input:checked + span::before{transform:translateX(21px);}

.about{
  margin-top:20px;padding:22px 20px;border-radius:24px;
  background:linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.12);
  text-align:center;
}
.about-title{
  font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.4);
  margin-bottom:14px;text-transform:uppercase;
}
.about-app{font-size:17px;font-weight:700;letter-spacing:2px;margin-bottom:6px;}
.about-ver{font-size:11.5px;color:rgba(255,255,255,.42);letter-spacing:1px;margin-bottom:16px;}
.about-divider{height:1px;background:rgba(255,255,255,.10);margin:0 auto 16px;width:60%;}
.about-author{font-size:13.5px;letter-spacing:1px;color:rgba(255,255,255,.78);line-height:1.9;}
.about-author b{
  color:#7dd3fc;font-weight:600;
  text-shadow:0 0 18px rgba(125,211,252,.5);
}

/* ================= 照片查看 ================= */
#photoViewer{
  position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;opacity:0;visibility:hidden;transition:.3s;
  padding:20px;
}
#photoViewer.show{opacity:1;visibility:visible;}
#photoImg{max-width:100%;max-height:72vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.8);}
.viewer-actions{display:flex;gap:14px;}
.viewer-btn{
  padding:12px 28px;border-radius:999px;font-size:14px;letter-spacing:1px;
  cursor:pointer;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25);
}
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <div id="vignette"></div>
  <div id="grid">
    <span class="v v1"></span><span class="v v2"></span>
    <span class="h h1"></span><span class="h h2"></span>
  </div>
</div>

<!-- 顶栏 -->
<div class="topbar">
  <div class="group">
    <button id="flashBtn" class="icon-btn glass disabled" aria-label="闪光灯">
      <svg viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"/></svg>
    </button>
  </div>
  <div class="group">
    <button id="settingsBtn" class="icon-btn glass" aria-label="设置">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
      </svg>
    </button>
  </div>
</div>

<!-- 变焦滑轨 -->
<div id="zoomRail">
  <div id="zoomTrack"><div id="zoomThumb"></div></div>
  <div id="zoomLabel">1.0×</div>
</div>

<!-- 底栏 -->
<div id="bottomBar">
  <div id="filterStrip"></div>
  <div class="controls">
    <button id="thumbBtn" class="side-btn glass" aria-label="相册">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
    </button>
    <button id="shutter" aria-label="快门"></button>
    <button id="switchBtn" class="side-btn glass" aria-label="切换摄像头">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4.5L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14 4.5L20 15"/><path d="M20 20v-5h-5"/></svg>
    </button>
  </div>
</div>

<div id="flashFx"></div>

<!-- 启动屏 -->
<div id="startScreen">
  <div class="start-card glass">
    <div class="logo"></div>
    <h1>液态相机</h1>
    <p>Liquid Cam<br>非线性变焦 · 电子防抖 · 液态玻璃</p>
    <button id="startBtn" class="glass">启 动 相 机</button>
    <div id="errorMsg"></div>
    <div class="hint">需 HTTPS 或 localhost 环境运行</div>
  </div>
</div>

<!-- 设置遮罩 -->
<div id="settingsOverlay"></div>

<!-- 设置面板 -->
<div id="settingsPanel" class="glass">
  <div class="panel-handle"></div>
  <div class="panel-title">设置</div>

  <div class="setting-row">
    <div>
      <div class="setting-title">电子防抖</div>
      <div class="setting-sub">EIS 运动补偿 · 手持拍摄更稳</div>
    </div>
    <label class="switch"><input type="checkbox" id="eisToggle" checked><span></span></label>
  </div>

  <div class="setting-row">
    <div>
      <div class="setting-title">网格线</div>
      <div class="setting-sub">三分法构图辅助</div>
    </div>
    <label class="switch"><input type="checkbox" id="gridToggle"><span></span></label>
  </div>

  <div class="setting-row">
    <div>
      <div class="setting-title">前置镜像</div>
      <div class="setting-sub">自拍画面水平翻转</div>
    </div>
    <label class="switch"><input type="checkbox" id="mirrorToggle"><span></span></label>
  </div>

  <div class="about">
    <div class="about-title">About</div>
    <div class="about-app">液态相机 Liquid Cam</div>
    <div class="about-ver">VERSION 1.0.0</div>
    <div class="about-divider"></div>
    <div class="about-author">
      作者 · Author<br>
      <b>不会飞的avata360</b> &amp; <b>mini3</b>
    </div>
  </div>
</div>

<!-- 照片查看 -->
<div id="photoViewer">
  <img id="photoImg" alt="照片">
  <div class="viewer-actions">
    <a id="downloadLink" class="viewer-btn glass" download="liquidcam.jpg">保存照片</a>
    <button id="closePhoto" class="viewer-btn glass">关闭</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     元素引用
     ========================================================= */
  const $ = id => document.getElementById(id);
  const videoEl     = $('video');
  const startScreen = $('startScreen');
  const startBtn    = $('startBtn');
  const errorMsg    = $('errorMsg');
  const flashBtn    = $('flashBtn');
  const settingsBtn = $('settingsBtn');
  const shutterBtn  = $('shutter');
  const switchBtn   = $('switchBtn');
  const thumbBtn    = $('thumbBtn');
  const filterStrip = $('filterStrip');
  const zoomTrack   = $('zoomTrack');
  const zoomThumb   = $('zoomThumb');
  const zoomLabel   = $('zoomLabel');
  const settingsPanel   = $('settingsPanel');
  const settingsOverlay = $('settingsOverlay');
  const eisToggle   = $('eisToggle');
  const gridToggle  = $('gridToggle');
  const mirrorToggle= $('mirrorToggle');
  const gridEl      = $('grid');
  const flashFx     = $('flashFx');
  const photoViewer = $('photoViewer');
  const photoImg    = $('photoImg');
  const closePhoto  = $('closePhoto');
  const downloadLink= $('downloadLink');

  /* =========================================================
     滤镜配置
     ========================================================= */
  const FILTERS = [
    { name: '原图',  css: 'none' },
    { name: '鲜明',  css: 'saturate(1.45) contrast(1.12) brightness(1.03)' },
    { name: '柔和',  css: 'saturate(0.85) contrast(0.95) brightness(1.08)' },
    { name: '黑白',  css: 'grayscale(1) contrast(1.18) brightness(1.02)' },
    { name: '胶片',  css: 'sepia(0.28) contrast(1.18) saturate(1.15) brightness(0.98)' },
    { name: '复古',  css: 'sepia(0.62) contrast(1.05) saturate(0.88) brightness(1.05)' },
    { name: '冷调',  css: 'hue-rotate(-12deg) saturate(1.22) contrast(1.06) brightness(1.02)' },
    { name: '暖阳',  css: 'sepia(0.22) saturate(1.32) hue-rotate(8deg) brightness(1.07)' },
    { name: '夜色',  css: 'brightness(1.16) contrast(1.22) saturate(1.3) hue-rotate(-8deg)' },
    { name: '褪色',  css: 'saturate(0.55) contrast(0.9) brightness(1.12)' },
    { name: '赛博',  css: 'hue-rotate(-25deg) saturate(1.9) contrast(1.25) brightness(1.05)' }
  ];

  /* =========================================================
     全局状态
     ========================================================= */
  const state = {
    facing: 'environment',
    torch: false,
    torchSupported: false,
    eis: true,
    mirror: false,
    filterIndex: 0,
    zoomT: 0,            // 0..1 归一化位置
    softwareScale: 1,    // 数字变焦倍率（硬件变焦时为 1）
    displayZoom: 1,
    eisDx: 0,
    eisDy: 0,
    running: false
  };

  let stream = null;
  let videoTrack = null;
  let zoomRange = { min: 1, max: 1, hw: false };
  let lastPhotoURL = null;

  /* =========================================================
     摄像头启动
     ========================================================= */
  async function startCamera(facing) {
    try {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      resetEIS();

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: facing },
          width:  { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      videoEl.srcObject = stream;
      await videoEl.play().catch(() => {});

      videoTrack = stream.getVideoTracks()[0];

      /* --- 能力探测 --- */
      let caps = {};
      try { caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {}; } catch (e) {}

      // 闪光灯（手电筒）
      state.torchSupported = !!caps.torch;
      state.torch = false;

      // 硬件变焦范围
      if (caps.zoom && caps.zoom.max > caps.zoom.min) {
        zoomRange = { min: caps.zoom.min, max: caps.zoom.max, hw: true };
      } else {
        zoomRange = { min: 1, max: 5, hw: false };
      }

      state.zoomT = 0;
      state.softwareScale = 1;
      state.displayZoom = zoomRange.min;

      buildZoomTicks();
      applyZoom();
      updateFlashUI();
      updateVideoTransform();

      state.running = true;
      errorMsg.style.display = 'none';

    } catch (err) {
      console.error(err);
      showError(err);
    }
  }

  function showError(err) {
    let msg = '无法访问摄像头';
    if (err && err.name === 'NotAllowedError') msg = '摄像头权限被拒绝，请在浏览器设置中允许访问';
    else if (err && err.name === 'NotFoundError') msg = '未检测到可用的摄像头设备';
    else if (err && err.name === 'NotReadableError') msg = '摄像头被其他应用占用';
    else if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      msg = '请使用 HTTPS 或 localhost 打开本页面';
    }
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
    startScreen.classList.remove('hide');
  }

  /* =========================================================
     非线性变焦
     ========================================================= */
  function zoomValueFromT(t) {
    const { min, max } = zoomRange;
    // 指数映射 —— 这就是"非线性"的核心
    return min * Math.pow(max / min, t);
  }

  function tFromZoomValue(v) {
    const { min, max } = zoomRange;
    if (max <= min) return 0;
    return Math.log(v / min) / Math.log(max / min);
  }

  function applyZoom() {
    const v = zoomValueFromT(state.zoomT);
    state.displayZoom = v;

    if (zoomRange.hw && videoTrack) {
      state.softwareScale = 1;
      try {
        videoTrack.applyConstraints({ advanced: [{ zoom: v }] }).catch(() => {});
      } catch (e) {}
    } else {
      state.softwareScale = v;
    }

    updateVideoTransform();
    updateZoomUI();
  }

  function updateZoomUI() {
    const v = state.displayZoom;
    zoomLabel.textContent = (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + '×';
    zoomThumb.style.bottom = (state.zoomT * 100) + '%';
  }

  function buildZoomTicks() {
    zoomTrack.querySelectorAll('.tick').forEach(n => n.remove());
    const { min, max } = zoomRange;
    const marks = [1, 2, 3, 5, 10].filter(m => m > min * 1.01 && m < max * 0.99);
    marks.forEach(m => {
      const t = tFromZoomValue(m);
      const el = document.createElement('div');
      el.className = 'tick';
      el.style.bottom = (t * 100) + '%';
      zoomTrack.appendChild(el);
    });
  }

  /* 滑轨拖拽 */
  let zoomDragging = false;
  function setZoomFromPointer(clientY) {
    const rect = zoomTrack.getBoundingClientRect();
    let t = 1 - (clientY - rect.top) / rect.height;
    t = Math.max(0, Math.min(1, t));
    state.zoomT = t;
    applyZoom();
  }
  zoomTrack.addEventListener('pointerdown', e => {
    zoomDragging = true;
    zoomTrack.setPointerCapture(e.pointerId);
    setZoomFromPointer(e.clientY);
    e.preventDefault();
  });
  zoomTrack.addEventListener('pointermove', e => {
    if (zoomDragging) setZoomFromPointer(e.clientY);
  });
  zoomTrack.addEventListener('pointerup', e => {
    zoomDragging = false;
    try { zoomTrack.releasePointerCapture(e.pointerId); } catch (err) {}
  });
  zoomTrack.addEventListener('pointercancel', () => { zoomDragging = false; });

  /* 双指捏合缩放（非线性） */
  const pointers = new Map();
  let pinchStartDist = 0, pinchStartT = 0;

  videoEl.parentElement.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
      pinchStartT = state.zoomT;
    }
  });
  videoEl.parentElement.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && pinchStartDist > 0) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      // 对数比例 → 感受上是线性的，数值上是非线性的
      const delta = Math.log(dist / pinchStartDist) / Math.log(zoomRange.max / zoomRange.min);
      state.zoomT = Math.max(0, Math.min(1, pinchStartT + delta));
      applyZoom();
      e.preventDefault();
    }
  });
  const clearPointer = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStartDist = 0;
  };
  videoEl.parentElement.addEventListener('pointerup', clearPointer);
  videoEl.parentElement.addEventListener('pointercancel', clearPointer);

  /* =========================================================
     画面变换（变焦 + 电子防抖位移 + 镜像）
     ========================================================= */
  function updateVideoTransform() {
    const margin = state.eis ? 1.08 : 1.0;         // 防抖预留边距
    const s = state.softwareScale * margin;
    const mirror = (state.facing === 'user' && state.mirror) ? ' scaleX(-1)' : '';
    videoEl.style.transform =
      `translate(${state.eisDx.toFixed(2)}px, ${state.eisDy.toFixed(2)}px) ` +
      `scale(${s.toFixed(4)})${mirror}`;
  }

  /* =========================================================
     电子防抖 EIS —— 帧间光流 + 平滑轨迹补偿
     ========================================================= */
  const SW = 72, SH = 54;
  const sampleCv = document.createElement('canvas');
  sampleCv.width = SW; sampleCv.height = SH;
  const sampleCtx = sampleCv.getContext('2d', { willReadFrequently: true });

  let prevGray = null;
  let grayBuf  = null;
  let trailX = 0, trailY = 0;    // 原始累积轨迹
  let smoothX = 0, smoothY = 0;  // 低通平滑轨迹
  let motionFrame = 0;

  function resetEIS() {
    prevGray = null;
    trailX = trailY = smoothX = smoothY = 0;
    state.eisDx = 0;
    state.eisDy = 0;
  }

  function motionLoop() {
    requestAnimationFrame(motionLoop);

    if (!state.running) return;

    if (state.eis && videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
      motionFrame++;
      // 每两帧采样一次，兼顾性能
      if (motionFrame % 2 === 0) updateEIS();
    } else if (!state.eis) {
      // 关闭时平滑回中
      if (Math.abs(state.eisDx) > 0.05 || Math.abs(state.eisDy) > 0.05) {
        state.eisDx *= 0.78;
        state.eisDy *= 0.78;
        updateVideoTransform();
      }
    }
  }

  function updateEIS() {
    try {
      sampleCtx.drawImage(videoEl, 0, 0, SW, SH);
    } catch (e) { return; }

    let data;
    try {
      data = sampleCtx.getImageData(0, 0, SW, SH).data;
    } catch (e) { return; }

    const n = SW * SH;
    if (!grayBuf) grayBuf = new Float32Array(n);
    const g = grayBuf;

    for (let i = 0, j = 0; i < n; i++, j += 4) {
      g[i] = data[j] * 0.299 + data[j + 1] * 0.587 + data[j + 2] * 0.114;
    }

    if (prevGray) {
      // Lucas–Kanade 单方向位移估计
      let gx2 = 0, gxit = 0, gy2 = 0, gyit = 0;
      for (let y = 1; y < SH - 1; y++) {
        const row = y * SW;
        for (let x = 1; x < SW - 1; x++) {
          const i = row + x;
          const gx = (g[i + 1] - g[i - 1]) * 0.5;
          const gy = (g[i + SW] - g[i - SW]) * 0.5;
          const it = g[i] - prevGray[i];
          gx2 += gx * gx;  gxit += gx * it;
          gy2 += gy * gy;  gyit += gy * it;
        }
      }

      let dx = gx2 > 1 ? -gxit / gx2 : 0;
      let dy = gy2 > 1 ? -gyit / gy2 : 0;

      // 限幅，避免剧烈场景跳变
      dx = Math.max(-1.5, Math.min(1.5, dx));
      dy = Math.max(-1.5, Math.min(1.5, dy));
      // 噪点忽略
      if (Math.abs(dx) < 0.02) dx = 0;
      if (Math.abs(dy) < 0.02) dy = 0;

      // 累积原始轨迹
      trailX += dx;  trailY += dy;
      // 低通得到"理想平滑轨迹"
      smoothX += (trailX - smoothX) * 0.10;
      smoothY += (trailY - smoothY) * 0.10;

      // 偏差 = 抖动分量 → 反向补偿
      const kx = innerWidth / SW;
      const ky = innerHeight / SH;

      let ox = -(trailX - smoothX) * kx * 0.75;
      let oy = -(trailY - smoothY) * ky * 0.75;

      const limX = innerWidth  * 0.038;
      const limY = innerHeight * 0.038;
      ox = Math.max(-limX, Math.min(limX, ox));
      oy = Math.max(-limY, Math.min(limY, oy));

      // 二次平滑，避免补偿本身抖动
      state.eisDx += (ox - state.eisDx) * 0.45;
      state.eisDy += (oy - state.eisDy) * 0.45;

      updateVideoTransform();

      // 缓慢衰减，防止轨迹无限漂移
      trailX *= 0.985;  smoothX *= 0.985;
      trailY *= 0.985;  smoothY *= 0.985;
    }

    if (!prevGray) prevGray = new Float32Array(n);
    prevGray.set(g);
  }

  /* =========================================================
     闪光灯
     ========================================================= */
  function updateFlashUI() {
    if (!state.torchSupported) {
      flashBtn.classList.add('disabled');
      flashBtn.classList.remove('on');
      return;
    }
    flashBtn.classList.remove('disabled');
    flashBtn.classList.toggle('on', state.torch);
  }

  async function toggleTorch() {
    if (!state.torchSupported || !videoTrack) return;
    const next = !state.torch;
    try {
      await videoTrack.applyConstraints({ advanced: [{ torch: next }] });
      state.torch = next;
    } catch (e) {
      state.torchSupported = false;
    }
    updateFlashUI();
  }

  /* =========================================================
     拍摄
     ========================================================= */
  function capturePhoto() {
    const vw = videoEl.videoWidth;
    const vh = videoEl.videoHeight;
    if (!vw || !vh) return;

    // 与预览一致的裁切比例
    const screenAR = innerWidth / innerHeight;
    let bw, bh;
    if (vw / vh > screenAR) { bh = vh; bw = vh * screenAR; }
    else                    { bw = vw; bh = vw / screenAR; }

    const margin = state.eis ? 1.08 : 1.0;
    const totalScale = state.softwareScale * margin;

    const sw = bw / totalScale;
    const sh = bh / totalScale;
    const sx = (vw - sw) / 2;
    const sy = (vh - sh) / 2;

    // 输出分辨率（长边上限 2560）
    const outScale = Math.min(1, 2560 / Math.max(sw, sh));
    const canvas = document.createElement('canvas');
    canvas.width  = Math.round(sw * outScale);
    canvas.height = Math.round(sh * outScale);

    const ctx = canvas.getContext('2d');

    // 镜像
    if (state.facing === 'user' && state.mirror) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }

    // 滤镜
    const f = FILTERS[state.filterIndex].css;
    if ('filter' in ctx && f !== 'none') {
      ctx.filter = f;
    }

    ctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

    // 暗角叠加
    ctx.filter = 'none';
    const grad = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.35,
      canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.72
    );
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 快门反馈
    flashFx.classList.add('fire');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => flashFx.classList.remove('fire'));
    });
    if (navigator.vibrate) navigator.vibrate(18);

    // 输出
    canvas.toBlob(blob => {
      if (!blob) return;
      if (lastPhotoURL) URL.revokeObjectURL(lastPhotoURL);
      lastPhotoURL = URL.createObjectURL(blob);

      thumbBtn.style.backgroundImage = `url(${lastPhotoURL})`;
      thumbBtn.querySelector('svg').style.opacity = '0';

      photoImg.src = lastPhotoURL;
      downloadLink.href = lastPhotoURL;
      downloadLink.download = `LiquidCam_${Date.now()}.jpg`;
      photoViewer.classList.add('show');
    }, 'image/jpeg', 0.94);
  }

  /* =========================================================
     UI 事件绑定
     ========================================================= */
  // 启动
  startBtn.addEventListener('click', async () => {
    startScreen.classList.add('hide');
    await startCamera(state.facing);
  });

  // 快门
  shutterBtn.addEventListener('click', capturePhoto);

  // 闪光灯
  flashBtn.addEventListener('click', toggleTorch);

  // 切换摄像头
  switchBtn.addEventListener('click', async () => {
    state.facing = state.facing === 'environment' ? 'user' : 'environment';
    state.torch = false;
    await startCamera(state.facing);
  });

  // 滤镜条
  FILTERS.forEach((f, i) => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (i === 0 ? ' active' : '');
    chip.textContent = f.name;
    chip.addEventListener('click', () => {
      state.filterIndex = i;
      [...filterStrip.children].forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      videoEl.style.filter = f.css === 'none' ? '' : f.css;
      chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
    filterStrip.appendChild(chip);
  });

  // 设置面板
  function openSettings() {
    settingsPanel.classList.add('show');
    settingsOverlay.classList.add('show');
  }
  function closeSettings() {
    settingsPanel.classList.remove('show');
    settingsOverlay.classList.remove('show');
  }
  settingsBtn.addEventListener('click', openSettings);
  settingsOverlay.addEventListener('click', closeSettings);

  // 设置项
  eisToggle.addEventListener('change', () => {
    state.eis = eisToggle.checked;
    if (!state.eis) resetEIS();
    updateVideoTransform();
  });

  gridToggle.addEventListener('change', () => {
    gridEl.classList.toggle('on', gridToggle.checked);
  });

  mirrorToggle.addEventListener('change', () => {
    state.mirror = mirrorToggle.checked;
    updateVideoTransform();
  });

  // 照片查看
  closePhoto.addEventListener('click', () => photoViewer.classList.remove('show'));
  photoViewer.addEventListener('click', e => {
    if (e.target === photoViewer) photoViewer.classList.remove('show');
  });
  thumbBtn.addEventListener('click', () => {
    if (lastPhotoURL) photoViewer.classList.add('show');
  });

  // 页面切后台时避免黑屏
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      state.running = false;
    } else if (stream) {
      state.running = true;
      videoEl.play().catch(() => {});
    }
  });

  /* =========================================================
     启动主循环
     ========================================================= */
  requestAnimationFrame(motionLoop);

  // 初始状态
  updateVideoTransform();
  updateZoomUI();

})();
</script>
</body>
</html>
